# ============================================================================
# Low-alignment / contamination diagnostics — configuration (TEMPLATE)
# Edit the values marked <EDIT>. Paths are relative to `project_dir` unless absolute.
# ============================================================================

project_dir: "/path/to/your/project"        # <EDIT> absolute path to your project

input:
  # Directory of per-sample aligned files that STILL CONTAIN unmapped reads —
  # i.e. the RAW aligner output (HISAT2/STAR/bwa .sam/.bam), NOT a post-filtered
  # unique-mapped BAM (which has the unaligned reads removed).
  align_dir:    "results/hisat2"            # <EDIT> dir of raw aligner output
  align_suffix: ".sam"                      # <EDIT> ".sam" or ".bam"
  unmapped_flag: 4                          # SAM flag selecting unmapped reads

output_dir: "alignment_debug"               # results go to <project_dir>/alignment_debug (or set absolute)

host_label: "Homo sapiens"                  # <EDIT> host organism — reporting only

sampling:
  # These caps bound the motif screen (02), top-seq/BLAST (03/04) and Kraken2 (06).
  # The bowtie2 genome screens (05 contaminant, 07 custom, 08 top-organism) align
  # ALL unaligned reads, regardless of these caps.
  unmapped_cap: 300000                      # max unaligned reads sampled per file (sampled steps)
  records_cap:  3000000                     # max alignment records scanned per file (bounds I/O)

# --- optional steps: leave the path/flag empty to skip that step ------------
kraken:
  db: ""                                    # Kraken2 DB dir (setup.sh prints the path); "" -> skip step 06

contaminant:
  reference_fasta: ""                       # local FASTA of the suspect genome; "" -> skip step 05
                                            # (fetch a genome by accession: ./setup.sh --ref-accession GCF_...
                                            #  or the Drosophila dm6 genome:  ./setup.sh --drosophila)

# --- optional: map unaligned reads to a CUSTOM fasta (transgene / vector / construct) ---
# Reports per-sample % mapping AND a per-sequence breakdown (which sequence in the fasta the
# reads hit). Independent of the contaminant genome screen above. "" -> skip step 07.
custom:
  fasta: ""                                 # custom FASTA path; "" -> skip step 07

blast:
  enabled: false                            # remote BLAST of the TOP (most-duplicated) unaligned seqs -> `snakemake blast` on a login node
  random: false                             # also BLAST RANDOM unaligned reads (login node) to find species Kraken2/motifs miss
  n_random: 25                              # random reads sampled per sample for the random BLAST
  db: "nt"
  max_target_seqs: 5

# --- optional step 08: auto-pick the top NON-HOST organism from the analysis
# (Kraken2 + random-BLAST), fetch its RefSeq genome from NCBI, and align unaligned
# reads to it. Needs internet -> run on a login node:
#   apptainer exec ... snakemake -s Snakefile --configfile config.yaml --cores 4 auto_ref_screen
auto_ref:
  enabled: false        # add step 08 to `rule all` (login node); or run the target above directly
  min_fraction: 0.05    # min support (fraction of classified/BLAST reads) to accept an organism (skips noise)

# --- optional step 09: MULTIMAPPED-read investigation — SPIKE-IN SEQUENCING ONLY ---
# (Steps 01-08 above work for BOTH spike-in and normal sequencing; step 09 is the one spike-in-
# specific step.) Requires BOTH enabled AND spikein below; enabling without spikein is skipped.
# Needs the PRE-FILTER alignment (multimappers not yet removed) to a COMBINED host+spike-in genome.
# Detection auto: NH:i>1 (HISAT2) -> XS present (bowtie2, matches its ">1 time" rate) -> MAPQ<=mapq_max.
# Reports the host vs spike-in split, what % of each genome's reads multimap, the top contigs the
# multimappers land on, and (cross_genome) the % of multimapped reads mapping to BOTH genomes.
multimap:
  enabled: false            # add step 09 (spike-in only — you must ALSO set spikein: true below)
  spikein: false            # REQUIRED true for step 09: reads aligned to a combined host+spike-in genome
                            #   (left false so a normal-sequencing run that flips enabled is skipped, not run degenerate)
  spikein_prefix: "spikein_" # contigs starting with this prefix belong to the spike-in genome
  method: "auto"            # auto | nh | xs | mapq
  xs_strict: false          # xs method: require XS == AS (an equally-best 2nd hit) rather than any XS
  mapq_max: 10              # mapq method / fallback: MAPQ <= this = multimapped
  # Step 09 can read a DIFFERENT alignment than steps 01-08 (which need unmapped reads). Point
  # these at the raw COMBINED host+spike-in BAM. Empty -> inherit input.align_dir / align_suffix.
  align_dir: ""             # e.g. "results/aligned" (raw bowtie2 combined output, indexed .bam)
  align_suffix: ""          # e.g. ".bam"
  # Cross-genome check (spike-in only): of the multimapped reads, what % map to BOTH genomes?
  # Re-aligns a sample of multimapped reads to SEPARATE host-only and spike-in-only bowtie2
  # indexes (the combined BAM can't answer this; bowtie2 -a is intractable on repeats).
  cross_genome: false       # enable the both-genomes check
  host_index: ""            # bowtie2 index basename, host only (e.g. "ref/HG38/genome")
  spikein_index: ""         # bowtie2 index basename, spike-in only (e.g. "ref/DM6/genome")
  cross_fraction: 1.0       # 1.0 = ALL multimapped reads; < 1 samples that fraction (faster on huge inputs)
  cross_cap: 0              # 0 = no cap; > 0 caps sampled reads per file (reservoir, genome-wide)
  cross_seed: 13            # sampling seed (only used when cross_fraction < 1 or cross_cap > 0)
  cross_codominant_margin: 5 # "codominant" = |host AS - spike-in AS| <= this (equally-good = ambiguous)

threads: 8
